# See plans/01-repo-and-toolchain.md (not committed) for the design
# behind this matrix, including the open risk on Windows + -race.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GO_VERSION: "1.23.4"
  # honnef.co/go/tools@latest can require a newer Go than GO_VERSION
  # pins (it has before: v0.7.0+ requires go1.26). Pin a version that
  # declares go1.23 or older, and bump deliberately alongside GO_VERSION.
  STATICCHECK_VERSION: "v0.6.1"
  # golang.org/x/perf ships pseudo-versions, not regular tags, so there
  # is no stable version string to pin here the way STATICCHECK_VERSION
  # pins one -- @latest is deliberate, not an oversight. Revisit only if
  # a specific pseudo-version needs pinning against a future Go bump,
  # the same reason STATICCHECK_VERSION exists.
  BENCHSTAT_VERSION: "latest"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
      - run: make lint

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...
      # cmd/lint-determinism and cmd/convert are separate modules (see
      # plans/01-repo-and-toolchain.md); ./... from the repo root does
      # not cross into them.
      - run: go test ./...
        working-directory: cmd/lint-determinism
      - run: go test ./...
        working-directory: cmd/convert

  # -race needs a working C toolchain on the runner. ubuntu-latest and
  # macos-latest images carry one; confirm the same is true for
  # windows-latest before adding it here -- see plans/01-repo-and-toolchain.md.
  race:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: cmd/lint-determinism
      - run: go test -race ./...
        working-directory: cmd/convert

  determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make determinism

  # Never combined with -race: the race detector's own instrumentation
  # allocates and would fail the zero-allocation gate unconditionally.
  #
  # make bench's own exit code is what enforces the zero-allocation
  # gate (internal/allocgate.AssertZero, applied in
  # plans/13-bench-and-profiles.md's own commits) -- a nonzero
  # allocation on a gated benchmark fails this step outright, no
  # benchstat step needed to catch that.
  #
  # The benchstat comparison below is warn-only, for throughput: it
  # posts to the job summary but never fails the build on its own,
  # because a CI runner's own noise is not yet characterized enough to
  # set a trustworthy hard tolerance (see plans/13-bench-and-profiles.md
  # -- "tune the tolerance empirically once real numbers exist," the
  # same rule this project applies to every other tolerance). It
  # compares against bench/baseline.txt, a file this repository does
  # not yet commit: BENCHMARKS.md's numbers so far are all from a
  # Windows development machine, which this job's own numbers -- from
  # ubuntu-latest -- are not comparable to (see BENCHMARKS.md's own
  # per-section environment lines). Establishing bench/baseline.txt is
  # a deliberate follow-up: take one committed bench-results artifact
  # from this job and commit it as bench/baseline.txt, so every later
  # comparison is CI-hardware to CI-hardware.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@${{ env.BENCHSTAT_VERSION }}
      - run: make bench BENCHCOUNT=6
      - name: Compare against the committed baseline
        if: hashFiles('bench/baseline.txt') != ''
        run: |
          {
            echo '## Benchmark comparison against bench/baseline.txt'
            echo '```'
            benchstat bench/baseline.txt bench/results/latest.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Note that no baseline is committed yet
        if: hashFiles('bench/baseline.txt') == ''
        run: echo 'No bench/baseline.txt committed yet, so this run has nothing to compare against -- see the bench job comments in .github/workflows/ci.yml for how to establish one.' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/latest.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fuzz
