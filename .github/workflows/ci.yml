# See plans/01-repo-and-toolchain.md (not committed) for the design
# behind this matrix, including the open risk on Windows + -race.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GO_VERSION: "1.23.4"
  # honnef.co/go/tools@latest can require a newer Go than GO_VERSION
  # pins (it has before: v0.7.0+ requires go1.26). Pin a version that
  # declares go1.23 or older, and bump deliberately alongside GO_VERSION.
  STATICCHECK_VERSION: "v0.6.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
      - run: make lint

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...
      # cmd/lint-determinism is a separate module (see
      # plans/01-repo-and-toolchain.md); ./... from the repo root does
      # not cross into it.
      - run: go test ./...
        working-directory: cmd/lint-determinism

  # -race needs a working C toolchain on the runner. ubuntu-latest and
  # macos-latest images carry one; confirm the same is true for
  # windows-latest before adding it here -- see plans/01-repo-and-toolchain.md.
  race:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: cmd/lint-determinism

  determinism:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make determinism

  # Never combined with -race: the race detector's own instrumentation
  # allocates and would fail the zero-allocation gate unconditionally.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make bench

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fuzz
